name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "29 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - run: python -m pip install -U pip "setuptools>=83" pip-audit
      - run: pip install -r backend/requirements.txt && pip-audit --progress-spinner off
      - run: npm ci && npm audit --audit-level=high
        working-directory: frontend
      - run: docker build -f docker/backend.Dockerfile -t ares-lite:ci .

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: python,javascript-typescript
      - uses: github/codeql-action/analyze@v4
